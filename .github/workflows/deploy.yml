name: Deploy to VSD

on:
    workflow_dispatch:

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Detect frontend changes
              uses: dorny/paths-filter@v3
              id: changes
              with:
                  filters: |
                      frontend:
                        - 'resources/**'
                        - 'package.json'
                        - 'package-lock.json'
                        - 'vite.config.js'
                        - 'tailwind.config.js'
                        - 'postcss.config.js'

            - name: Show detection result
              run: |
                  echo "frontend changed: ${{ steps.changes.outputs.frontend }}"

            - name: Execute deploy script via SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
                  ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_ed25519 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
                    "cd /var/www/milkshop && FRONTEND_CHANGED=${{ steps.changes.outputs.frontend }} bash deploy.sh"
